spring:
  application:
    name: hotel-ai

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hotel_ai}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate        # schema managed by SQL migration files
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

# ── LangChain4j ──────────────────────────────────────────────────────────────
langchain4j:
  open-ai:
    chat-model:
      api-key:     ${OPENAI_API_KEY:}
      model-name:  ${LLM_MODEL:gpt-4o-mini}
      temperature: 0.3
      max-tokens:  512
    embedding-model:
      api-key:     ${OPENAI_API_KEY:}
      model-name:  ${EMBED_MODEL:text-embedding-3-small}

# ── Qdrant ───────────────────────────────────────────────────────────────────
qdrant:
  host:    ${QDRANT_HOST:localhost}
  port:    ${QDRANT_PORT:6334}      # gRPC port
  use-tls: false
  api-key: ${QDRANT_API_KEY:}

# ── Agent ─────────────────────────────────────────────────────────────────────
agent:
  rag:
    top-k:         5
    score-cutoff:  0.35
  history-window:  10
  max-steps:       5

# ── CORS ─────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${ALLOWED_ORIGINS:*}
